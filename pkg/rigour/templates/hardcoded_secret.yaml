name: hardcoded_secret
description: "Detects and removes hardcoded secrets, replacing them with environment variable lookups or config loading"
severity: critical
category: security
ast_grep_pattern: |
  rule:
    pattern: |
      "$SECRET"
    kind: string_literal
    metavariable:
      $SECRET:
        regex: "(?i)(password|secret|api.?key|token|auth.*key)\\s*[:=]"
  fix:
    action: replace
    replacement: os.Getenv("REDACTED")
instructions:
  - "Remove hardcoded secret values from source code"
  - "Replace with os.Getenv or a config loader (viper, envconfig, etc.)"
  - "Add the secret name to .env.example (without the value)"
  - "Ensure secrets are never logged or included in error messages"
  - "Add a startup validation that required env vars are set"
verification:
  - "go vet ./..."
  - "grep -rn 'password\\s*[:=]\\s*\"\\|secret\\s*[:=]\\s*\"\\|api_key\\s*[:=]\\s*\"\\|token\\s*[:=]\\s*\"' --include='*.go' | grep -v '_test.go' | grep -v 'env\\|config\\|example\\|fixture\\|mock' | wc -l | xargs test 0 -eq"
constraints:
  do_not_touch:
    - "vendor/"
    - "go.sum"
    - ".env"
    - ".env.local"
  max_files: 10
  paradigm: "none"
